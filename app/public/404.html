<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Camping Shop — Đồ cắm trại</title>
    <script>
      // GitHub Pages không có server-side fallback cho SPA: gõ trực tiếp
      // một đường dẫn con (/shop, /admin...) vào thanh địa chỉ sẽ rơi vào
      // file 404.html này. Script chuyển hướng về trang chủ kèm đường dẫn
      // gốc trong query (?/admin), để index.html khôi phục lại đường dẫn
      // trước khi React khởi động (kỹ thuật Single Page Apps for GitHub Pages).
      var pathSegmentsToKeep = 1 // '/camping-shop' chiếm 1 đoạn đường dẫn
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
