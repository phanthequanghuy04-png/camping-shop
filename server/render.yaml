# Render Blueprint — backend API Camping Shop (Node + Express)
# Dùng: tạo repo GitHub -> Render Dashboard -> New -> Blueprint -> chọn repo.
# Render TỰ tạo web service từ file này. Nhớ đặt các biến môi trường bên dưới
# trong Dashboard (Render không đọc file .env trong repo).
# LƯU Ý: Render KHÔNG có MySQL — chỉ có PostgreSQL. Server này dùng mysql2
# nên database MySQL phải đặt ở Railway (xem DEPLOY.md mục 4). Đừng tạo
# database trên Render cho dự án này.
services:
  - type: web
    name: camping-shop-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: camping
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
