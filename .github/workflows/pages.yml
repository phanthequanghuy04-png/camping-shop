# BẢN NHÁP — workflow GitHub Pages cho web camping-shop, đã thêm VITE_API_URL.
# File gốc: .github/workflows/pages.yml (KHÔNG sửa file gốc).
# Trước khi dùng: thay VERCEL_API_URL bằng URL thật của backend Vercel,
# vd: https://camping-shop-api.vercel.app (KHÔNG có dấu / ở cuối).
# Sau đó tải file này lên repo, ghi đè .github/workflows/pages.yml, commit
# lên nhánh main — workflow sẽ tự chạy (on: push) và build lại frontend
# với VITE_API_URL đã nhúng vào bundle lúc build.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: app
      - name: Build
        run: npm run build
        working-directory: app
        env:
          # VITE_API_URL là biến build-time: Vite nhúng giá trị này vào
          # bundle JS lúc build (app/src/lib/api.ts đọc import.meta.env).
          # Phải thay VERCEL_API_URL bằng URL Vercel thật trước khi commit.
          VITE_API_URL: https://camping-shop-api.vercel.app
          # Thông tin tài khoản nhận tiền thật của shop (Huy cung cấp 2026-11-27):
          # MB Bank — dùng để hiện mã VietQR trên màn hình đặt hàng thành công.
          VITE_BANK_CODE: MB
          VITE_BANK_NAME: MB Bank
          VITE_BANK_ACCOUNT: 0708065040
          VITE_BANK_HOLDER: Phan Thế Quang Huy
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
